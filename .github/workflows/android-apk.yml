name: Build APK TOEIC Grammaire

on:
  push:
    paths:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk TOEIC-Grammaire.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TOEIC-Grammaire-apk
          path: TOEIC-Grammaire.apk

      # Un tag v* (ex. v1.0) publie aussi l'APK dans une Release GitHub, téléchargeable depuis le téléphone.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TOEIC-Grammaire.apk
