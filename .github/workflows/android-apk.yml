name: Build APK TOEIC Grammaire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk TOEIC-Grammaire.apk

      # version.json est lu par l'appli au démarrage pour proposer la mise à jour.
      - name: Write version.json
        id: version
        run: |
          CODE=$(sed -n "s/^ *versionCode \([0-9]*\)$/\1/p" app/build.gradle)
          NAME=$(sed -n "s/^ *versionName '\(.*\)'$/\1/p" app/build.gradle)
          jq -n --argjson code "$CODE" --arg name "$NAME" --rawfile notes release-notes.txt \
            '{versionCode: $code, versionName: $name, notes: ($notes | rtrimstr("\n")), apk: "TOEIC-Grammaire.apk"}' > version.json
          cat version.json
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TOEIC-Grammaire-apk
          path: TOEIC-Grammaire.apk

      # Chaque version (versionName dans app/build.gradle) a sa Release ; la plus récente est celle que l'appli lit.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: TOEIC Grammaire ${{ steps.version.outputs.name }}
          body_path: release-notes.txt
          make_latest: true
          files: |
            TOEIC-Grammaire.apk
            version.json
