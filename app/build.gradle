plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.esiee.toeicgrammaire'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.esiee.toeicgrammaire'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    // Toutes les versions doivent être signées avec la même clé, sinon Android refuse
    // d'installer une mise à jour par-dessus l'appli existante.
    signingConfigs {
        shared {
            storeFile file('toeic-grammaire.keystore')
            storePassword 'toeicgrammaire'
            keyAlias 'toeic'
            keyPassword 'toeicgrammaire'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
